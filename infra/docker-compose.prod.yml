# Prod overlay — independent deploy of include-cookie-frontend.
#
#   docker compose -p include-cookie --env-file infra/.env.prod \
#     -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d
#
# Own Compose project, own Cloudflare tunnel, own release cadence — the lumispace repo no
# longer starts this app. What it still shares is the lumispace stack's Docker NETWORK, so
# it can reach catalog/auth/rustfs by service name (see the note in docker-compose.yml).
#
# ⚠ APP_VERSION is the Docker IMAGE TAG, not the app version. CI publishes only `latest`
# and the full commit SHA — putting a package.json version here makes `pull` fail with
# "manifest unknown" and nothing starts. Leave it unset unless pinning a real CI-pushed SHA.
services:
  frontend:
    image: "ghcr.io/axiks/include-cookie-frontend:${APP_VERSION:-latest}"
    container_name: include-cookie-frontend
    env_file:
      - path: ./.env.prod
    # These pin the in-network service URLs, overriding whatever .env.prod says — the env
    # file carries only the secrets/toggles. Any of them may be unreachable: each feature
    # degrades on its own (README's architecture table).
    environment:
      NODE_ENV: production
      CATALOG_API_URL: http://catalog:3000
      AUTH_SERVICE_URL: http://auth:8082
      BOT_API_URL: http://bot:8081
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-pandc}
    networks:
      - default
      - lumispace

  # Own ingress. The lumispace stack's tunnel used to route to this app when lumispace
  # started it; now that this repo deploys itself, it needs its own connector and its own
  # TUNNEL_TOKEN. Point the public hostname at `http://frontend:3000` in the Cloudflare
  # Zero Trust dashboard.
  tunnel:
    image: cloudflare/cloudflared
    container_name: include-cookie-tunnel
    restart: unless-stopped
    command: tunnel run
    env_file:
      - path: ./.env.prod
    depends_on:
      frontend:
        condition: service_started

networks:
  # This project's own network — carries tunnel ↔ frontend only.
  default:

  # The lumispace stack's network, created by ITS compose (project `pandc` ⇒ `pandc_default`).
  # Must already exist: `docker network ls`. Override the name via LUMISPACE_NETWORK if your
  # lumispace project name differs.
  lumispace:
    external: true
    name: ${LUMISPACE_NETWORK:-pandc_default}
