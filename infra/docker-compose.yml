# include-cookie-frontend — base compose (build + service graph).
#
# Never used alone: pair it with exactly one overlay.
#   dev   docker compose -p include-cookie-dev --env-file infra/.env.dev \
#           -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up -d
#   prod  docker compose -p include-cookie --env-file infra/.env.prod \
#           -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d
#
# This app owns NO data and NO backing services — it's a read-only frontend over other
# services' REST APIs (see README's architecture table). So there is deliberately no
# Postgres/Dgraph/Kratos/S3 defined here: those belong to the lumispace stack and to
# lumi-auth, which deploy themselves. Everything this app talks to is INDEPENDENTLY
# OPTIONAL — with none of it reachable the app still starts and serves its static pages,
# just with degraded sections.
#
# How it reaches those services: the overlays attach this container to the lumispace
# stack's Docker network as an EXTERNAL network, so `catalog:3000` / `auth:8082` /
# `rustfs:9000` resolve by service name. Those APIs are internal-key-authenticated and
# deliberately NOT published to the host or the internet, which is why a shared network is
# used rather than public URLs.
services:
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # Overridden by CI with the real commit; `local` when built by hand.
        GIT_COMMIT: ${GIT_COMMIT:-local}
    restart: unless-stopped
    # Accepts any non-5xx: the pages render (degraded) even with every optional upstream
    # down, so a 200-only check would fail for the wrong reason.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
