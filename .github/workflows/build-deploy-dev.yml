name: Build & Deploy (dev)

on:
  push:
    branches: [development]

env:
  IMAGE: ghcr.io/axiks/include-cookie-frontend

jobs:
  build:
    name: Build & Push (dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # The GHCR namespace this repo publishes to is `axiks` (see IMAGE above), which is
          # NOT necessarily the repo owner — this repo can live in an org while its packages
          # stay in that personal namespace. Pin the login to the namespace owner so a repo
          # transfer can't change it out from under us.
          username: Axiks
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:dev-${{ github.sha }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Own dev deploy — see the prod workflow for the rationale. Separate Compose project and
  # separate directory from prod on the same host, attached to lumispace's DEV network.
  deploy:
    name: Deploy to server (dev)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Copy compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "infra/docker-compose.yml,infra/docker-compose.dev.yml"
          strip_components: 1
          target: $HOME/dockers/include-cookie-dev/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          # Owner of the GHCR namespace being pulled from (ghcr.io/axiks/...), NOT whoever
          # pushed — `github.actor` would become another org member once this repo lives in
          # an org, while the packages stay in that personal namespace.
          GHCR_USER: Axiks
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            retry() {
              attempt=1
              while true; do
                if "$@"; then return 0; fi
                if [ "$attempt" -ge 3 ]; then return 1; fi
                echo "pull failed, retry $attempt/3 in 10s…"
                attempt=$((attempt + 1))
                sleep 10
              done
            }
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd "$HOME/dockers/include-cookie-dev"
            test -f .env.dev || { echo "ERROR: .env.dev missing on server — create it from infra/.env.dev.example"; exit 1; }
            COMPOSE="docker compose -p include-cookie-dev --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml"
            retry $COMPOSE pull
            $COMPOSE up -d --remove-orphans
            docker logout ghcr.io || true
            docker image prune -f || true
